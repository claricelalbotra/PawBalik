[pytest]
testpaths = tests
pythonpath = .
# tests/_probes/ holds throwaway probe tests; run them only by explicit path.
norecursedirs = _probes .* __pycache__ node_modules
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:firebase_admin.*
markers =
    config(**overrides): override Flask config keys for the `app` fixture of this test
